name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 只在 PR 上跑。push 到 main 不再触发：日常用 GitHub Desktop 直接同步主干，
# 推送即红只会污染 Actions 列表。质量门禁改为「PR + 本地自检」两道——
# 推送前跑 uv run quick-check（ruff format/check + mypy）、
# uv run check --skip-hook-install（再加 pytest + check_thread_safety）。
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 锁定 3.15：程序已迁移到 Python 3.15（pyproject 的 requires-python 为 >=3.15，
      # 3.15 是当前唯一构建目标），这里显式钉死，避免 uv 自行挑选解释器导致结果不可预期。
      UV_PYTHON: "3.15"
      # PyYAML 至今没有 cp315 wheel（见「Install locked dependencies」）：置 0 让它
      # 跳过 `yaml._yaml` C 扩展，从 sdist 直接产出纯 Python wheel，不需要编译器。
      PYYAML_FORCE_LIBYAML: "0"
      # 关掉 uv run 的隐式 sync：依赖统一在安装步骤显式 sync 一次，隐式 sync 每次
      # uv run 都会重新解析（可能重建 pyyaml，拖慢构建）。
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="HEAD^"
          fi
          files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          code_changed=false
          actor_db_changed=false
          info_db_changed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              resources/userdata/actor_database.xlsx|scripts/check_actor_db.py)
                actor_db_changed=true
                code_changed=true
                ;;
              resources/userdata/info_database.xlsx|scripts/check_info_db.py)
                info_db_changed=true
                code_changed=true
                ;;
              *.md|*.mdx|.monkeycode/*|docs/*) ;;
              *) code_changed=true ;;
            esac
          done <<< "$files"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "actor_db_changed=$actor_db_changed" >> "$GITHUB_OUTPUT"
          echo "info_db_changed=$info_db_changed" >> "$GITHUB_OUTPUT"

      - name: Run docs-only check
        if: steps.changes.outputs.code_changed != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then BASE_SHA="HEAD^"; fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Install system dependencies
        if: steps.changes.outputs.code_changed == 'true'
        run: >
          sudo apt-get update -y && sudo apt-get install -y
          libglib2.0-0 libegl1 libgl1 libfontconfig1
          libqt6core6 libqt6gui6 libqt6widgets6 libqt6network6 libqt6xml6
          libdbus-1-3 libxkbcommon0 libopengl0
          libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
          pkg-config libavformat-dev libavcodec-dev libavdevice-dev
          libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
          libxml2-dev libxslt1-dev libxslt-dev python3-dev zlib1g-dev gcc

      - name: Set up Python 3.15
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        if: steps.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v10.1.0

      # PyYAML 至今没有 cp315 wheel（6.0.3 只发到 cp314），3.15 下 uv sync 会退回源码
      # 编译（Windows runner 缺 MSVC 头文件、Linux 也要编译器）。工作流级
      # `PYYAML_FORCE_LIBYAML=0` 让 PyYAML 的 setup.py 跳过 `yaml._yaml` C 扩展，直接
      # 产出纯 Python wheel（py3-none-any）：不需要编译器，产物还是通用 wheel（不掺
      # 别的 ABI 版本）。`_yaml` 本就只是可选的 C 加速，缺它时 PyYAML 自动退回纯 Python
      # 实现，功能一致。等 PyYAML 出了 cp315 wheel，删掉这个环境变量即可。
      - name: Install locked dependencies
        if: steps.changes.outputs.code_changed == 'true'
        shell: bash
        run: |
          uv sync --locked --dev
          VENV_PY="$PWD/.venv/bin/python"
          [ -x "$VENV_PY" ] || VENV_PY="$PWD/.venv/Scripts/python.exe"
          "$VENV_PY" -c "import yaml; print('pyyaml', yaml.__version__, 'libyaml', yaml.__with_libyaml__)"

      - name: Run ruff format
        if: steps.changes.outputs.code_changed == 'true'
        run: uv run ruff format --check

      - name: Run ruff check
        if: steps.changes.outputs.code_changed == 'true'
        run: uv run ruff check --output-format=github

      - name: Run mypy
        if: steps.changes.outputs.code_changed == 'true'
        run: uv run mypy mdcx/

      - name: Run pytest
        if: steps.changes.outputs.code_changed == 'true'
        # PyQt6 需要 display 才能实例化 QApplication；offscreen 平台无需 X11/Wayland
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ --tb=short -m "not network"

      - name: Run check_actor_db
        if: steps.changes.outputs.actor_db_changed == 'true'
        run: uv run python -m scripts.check_actor_db

      - name: Run check_info_db
        if: steps.changes.outputs.info_db_changed == 'true'
        run: uv run python -m scripts.check_info_db

      - name: Run check_thread_safety
        if: steps.changes.outputs.code_changed == 'true'
        run: uv run python -m scripts.check_thread_safety

  windows:
    name: Windows Compatibility and Build
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # 与 quality job 同口径：3.15 为当前构建目标。
      UV_PYTHON: "3.15"
      # PyYAML 至今没有 cp315 wheel（见「Install dependencies」）：置 0 让它跳过
      # `yaml._yaml` C 扩展，从 sdist 直接产出纯 Python wheel，不需要 MSVC。
      PYYAML_FORCE_LIBYAML: "0"
      # 关掉 uv run 的隐式 sync：依赖统一在安装步骤显式 sync 一次（见安装步骤注释）。
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if ($base -eq '0000000000000000000000000000000000000000' -or -not (git cat-file -e "$base^{commit}" 2>$null)) { $base = 'HEAD^' }
          $files = git diff --name-only $base $env:GITHUB_SHA
          $codeChanged = $false
          foreach ($file in $files) {
            if ([string]::IsNullOrWhiteSpace($file)) { continue }
            if ($file -notmatch '(^|/)([^/]+\.md|[^/]+\.mdx)$' -and $file -notmatch '^\.monkeycode/' -and $file -notmatch '^docs/') { $codeChanged = $true; break }
          }
          "code_changed=$($codeChanged.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run docs-only check
        if: steps.changes.outputs.code_changed != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $base = $env:BASE_SHA
          if ($base -eq '0000000000000000000000000000000000000000' -or -not (git cat-file -e "$base^{commit}" 2>$null)) { $base = 'HEAD^' }
          git diff --check $base $env:GITHUB_SHA

      - name: Set up Python 3.15
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up uv
        if: steps.changes.outputs.code_changed == 'true'
        uses: astral-sh/setup-uv@v10.1.0
        with:
          activate-environment: true

      # PyYAML 至今没有 cp315 wheel（6.0.3 只发到 cp314），3.15 下只能源码编译，
      # Windows runner 缺 MSVC 头文件会直接失败。工作流级 `PYYAML_FORCE_LIBYAML=0`
      # 让它跳过 `yaml._yaml` C 扩展，直接产出纯 Python wheel（py3-none-any），
      # 不需要编译器；`_yaml` 只是可选的 C 加速，缺它时 PyYAML 自动退回纯 Python
      # 实现，功能一致。等 PyYAML 出了 cp315 wheel，把这个环境变量删掉即可。
      - name: Install dependencies
        if: steps.changes.outputs.code_changed == 'true'
        shell: pwsh
        run: |
          uv sync --locked --all-extras --dev
          $venvPy = ".venv\Scripts\python.exe"
          & $venvPy -c "import yaml; print('pyyaml', yaml.__version__, 'libyaml', yaml.__with_libyaml__)"

      - name: Run Windows offline tests
        if: steps.changes.outputs.code_changed == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: uv run pytest tests/ --tb=short -m "not network"

      # 一体包硬失败：Windows 冒烟必须先有 build/sr_tools，否则 build.py 直接 BuildError。
      # 缓存由 update-sr-tools.yml 预热；命中时 fetch 幂等跳过，未命中则当场拉取。
      - name: Restore SR tools cache
        if: steps.changes.outputs.code_changed == 'true'
        uses: actions/cache@v6
        with:
          path: build/sr_tools
          key: sr-tools-windows

      - name: Fetch SR tools
        if: steps.changes.outputs.code_changed == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: uv run python -m scripts.fetch_sr_tools --platform windows

      # 打包参数回归（hidden-import / add-binary / 图标）只在发版 tag 才暴露，
      # 这里做一次 PyInstaller 冒烟构建，把问题前置到 PR/主干。
      - name: Build smoke test (PyInstaller)
        if: steps.changes.outputs.code_changed == 'true'
        timeout-minutes: 20
        env:
          PYTHONIOENCODING: utf-8
        run: uv run scripts/build.py --version 0 --debug
